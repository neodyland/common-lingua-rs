[workspace]
members = ["./common-lingua", "./common-lingua-wasm", "./common-lingua-py"]
resolver = "3"

[workspace.package]
version = "0.2.3"
edition = "2024"
description = "Rust port of common lingua, a language detection model."
license = "Apache-2.0"
repository = "https://github.com/neodyland/common-lingua-rs"
readme = "README.md"
keywords = ["nlp"]
categories = ["text-processing", "internationalization", "no-std"]

[workspace.dependencies]
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
fearless_simd = "1.2.0"
fearless_simd_macros = "0.1.0"
safetensors = { version = "0.8.0", default-features = false }
web-time = "1.1.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
